<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vercel serves this file, with a 404 status, for any URL that doesn't exist -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | SNA Digital</title>
    <meta name="description" content="This page doesn't exist. Head back to SNA Digital, the web development studio of Nadeem Shaikh in Mumbai." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050505" />

    <!-- Apply the saved light/dark theme before first paint so there's no flash -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafaf9');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/not-found.jsx"></script>
  </body>
</html>
